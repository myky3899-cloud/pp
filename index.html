<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي التجريبي الأول</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: inline-block;
            max-width: 400px;
            width: 100%;
        }
        h1 { color: #4caf50; }
        p { font-size: 18px; color: #bbb; }
        .btn {
            background-color: #4caf50;
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 5px;
            display: inline-block;
            margin-top: 20px;
            font-weight: bold;
        }
        .btn:hover { background-color: #45a049; }
    </style>
</head>
<body>

    <div class="container">
        <h1>أهلاً بك في موقعي الأول! 🎉</h1>
        <p>هذا الموقع يعمل الآن مباشرة ومستضاف مجاناً على GitHub Pages.</p>
        <p>أي تغيير سأقوم بكتابته سيظهر هنا فوراً بعد التحديث.</p>
        <a href="#" class="btn">اضغط هنا للتجربة</a>
    </div>

</body>
</html>
